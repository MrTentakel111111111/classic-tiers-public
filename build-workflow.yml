name: Mod bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Mod bauen
        run: gradle build --no-daemon

      - name: JAR als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: classic-tiers-jar
          path: build/libs/*.jar

      - name: JAR als Release anhaengen (direkter Download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" build/libs/*.jar --title "Build ${{ github.run_number }}" --notes "Automatisch gebaut"
